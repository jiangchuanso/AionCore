[advisories]
# RUSTSEC-2023-0071 (rsa: Marvin timing sidechannel): pre-existing lockfile-only
# entry pulled in by a target/feature-gated dependency; `cargo tree -i rsa`
# resolves to nothing in our build graph, and no patched release exists yet.
#
# RUSTSEC-2026-0459 (libsqlite3-sys: bundled SQLite < 3.54.0, CVE-2026-119375):
# patched in libsqlite3-sys >= 0.39.0, which no SQL driver we use accepts yet:
# sqlx-sqlite 0.9.0 (current latest) still requires `>=0.30.1, <0.38.0`, and
# the tree pins libsqlite3-sys through sqlx-sqlite 0.8.6 (`^0.30.1`) plus
# rusqlite 0.32.1 (`^0.30.1`). Both enable `bundled`, so the vulnerable SQLite
# copy is compiled in. Tracked as a dependency-modernization follow-up; drop
# this ignore as soon as an sqlx release allows libsqlite3-sys >= 0.39.
#
# RUSTSEC-2026-0462 (rmcp: unbounded response body buffering in Streamable HTTP
# clients): the vulnerable code only exists behind rmcp's
# `transport-streamable-http-client-reqwest` / `-unix-socket` features. We never
# enable them: `aionui-app` depends on rmcp with
# `features = ["server", "transport-io", "schemars"]`, and rmcp 1.7.0's own
# default features are `["base64", "macros", "server"]`, so the HTTP client
# transport is not compiled into the binary at all. Fixing properly means
# migrating to rmcp >= 3.9.0 (two major versions); tracked separately.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0462",
]
