name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'chore: release') || startsWith(github.event.head_commit.message, 'chore(main): release')"
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Trigger Release build workflow
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Release created: ${{ steps.release.outputs.tag_name }}"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --field "tag_name=${{ steps.release.outputs.tag_name }}"

  update-pr:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release') && !startsWith(github.event.head_commit.message, 'chore(main): release')"
    steps:
      # `GITHUB_TOKEN` cannot open a PR unless the repository has
      # "Allow GitHub Actions to create and approve pull requests" enabled
      # (Settings > Actions > General). A PAT is unaffected by that toggle, so
      # `RELEASE_PLEASE_TOKEN` is the supported escape hatch; without it we fall
      # back to the job token and degrade to a warning instead of a red build.
      - uses: googleapis/release-please-action@v5
        id: release-please
        continue-on-error: true
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Report release PR status
        if: steps.release-please.outcome == 'failure'
        run: |
          echo "::warning title=release-please could not open a release PR::The release PR was not created (typically: 'GitHub Actions is not permitted to create or approve pull requests'). Enable the toggle in Settings > Actions > General, or set a PAT in the RELEASE_PLEASE_TOKEN secret. Tag pushes (v*) still publish through release.yml."

      - name: Checkout release PR branch
        if: steps.release-please.outputs.pr
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(steps.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        if: steps.release-please.outputs.pr
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Update Cargo.lock for workspace version bump
        if: steps.release-please.outputs.pr
        run: cargo update --workspace

      - name: Commit and push Cargo.lock if changed
        if: steps.release-please.outputs.pr
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: update Cargo.lock for workspace version bump"
            git push
          fi
